 const ORDER_RECOGNITION_ENDPOINT=SB_URL+'/functions/v1/order-recognition';
 const s=document.getElementById('screen'),nav=document.getElementById('nav');s.innerHTML='';let session=null,profile=null,wallet={available:0,frozen:0},currentTrip=null,currentTask=null,currentNegotiation=null,publishedTasks=[],acceptedAssignments=[],profileCache={},reviewsCache={},friendStatus={},friendsCache=[],allCompletedOrders=[],favoriteIds=new Set();
function setNav(key){nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-nav')===key)})}
function fmtDT(v){if(!v)return'';const d=new Date(v);const t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});const md=d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})==new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})?'':' '+d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});return t+md}
function taskTimeLine(t){if(!t)return'';const chips=[];if(t.estimated_arrival_at)chips.push('<span>🧭 预计外卖 '+fmtDT(t.estimated_arrival_at)+'</span>');if(t.latest_accept_at)chips.push('<span>🕒 最晚接单 '+fmtDT(t.latest_accept_at)+'</span>');if(t.latest_delivery_at)chips.push('<span>⏰ 最晚送达 '+fmtDT(t.latest_delivery_at)+'</span>');if(t.timeout_penalty||t.timeout_cancel){const pc=t.timeout_penalty==='charge'?'超时扣分':'超时不扣分';const cc=t.timeout_cancel==='immediate'?'到点取消':(t.timeout_cancel==='grace'?'超时'+t.timeout_grace_minutes+'分钟取消':(t.timeout_cancel==='remind'?'仅提醒':'自动取消'));chips.push('<span>💸 '+pc+' · '+cc+'</span>')}return chips.length?'<div class="meta">'+chips.join('')+'</div>':''}

function headers(extra={}){return {'apikey':SB_KEY,'Authorization':`Bearer ${session?.access_token||SB_KEY}`,'Content-Type':'application/json',...extra}}
let refreshPromise=null;async function refreshSession(){if(refreshPromise)return refreshPromise;refreshPromise=(async()=>{if(!session?.refresh_token)throw Error('登录已过期，请重新登录');const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});const d=await r.json();if(!r.ok||!d.access_token)throw Error(d.message||d.msg||'登录已过期，请重新登录');session=d;localStorage.setItem('shundai_session',JSON.stringify(d));return d})().finally(()=>refreshPromise=null);return refreshPromise}
async function authorizedFetch(url,opt={},retry=true){if(session?.expires_at&&session.expires_at*1000<Date.now()+60000)await refreshSession();let r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});if(retry&&(r.status===401||r.status===403)){const body=await r.clone().text();if(/expired|jwt/i.test(body)){await refreshSession();r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}})}}return r}
async function api(path,opt={}){const r=await authorizedFetch(`${SB_URL}/rest/v1/${path}`,opt);if(!r.ok)throw Error((await r.text())||`请求失败 ${r.status}`);const t=await r.text();return t?JSON.parse(t):null}

function authView(msg=''){nav.style.display='none';s.innerHTML=`<div class="authmark">顺</div><div style="text-align:center"><h2>登录顺带</h2><p class="muted">登录后，行程和任务会保存到 Supabase</p></div>${msg?`<div class="error">${esc(msg)}</div>`:''}<div class="field"><label>邮箱</label><input class="input" id="email" type="email" placeholder="name@example.com"></div><div class="field"><label>密码</label><input class="input" id="password" type="password" placeholder="至少 6 位"></div><button class="primary" onclick="signIn()">登录</button><button class="secondary" onclick="signUp()">注册新账号</button><button class="secondary" onclick="enterDemoMode()" style="margin-top:6px;background:#eaf4ec;color:#245434;font-weight:600">⚡ Demo 模式 · 跳过注册</button>`}
async function authRequest(kind){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return authView('请输入有效邮箱，密码至少 6 位。');try{const url=kind==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const r=await fetch(SB_URL+url,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{display_name:'陈同学'}})});const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch{}if(!r.ok)throw Error(d.msg||d.message||d.error_description||`Supabase 返回 ${r.status}`);if(!d.access_token){authView('注册成功，请先到邮箱点击确认链接再登录。');return}session=d;localStorage.setItem('shundai_session',JSON.stringify(d));await loadState();nav.style.display='flex';home()}catch(e){const network=/Failed to fetch|NetworkError|Load failed|connection/i.test(e.message);authView(network?'无法连接 Supabase。请在 Dashboard → Project Settings → Data API 重新复制 Project URL，并检查当前网络或代理。':e.message)}}
const signIn=()=>authRequest('signin'),signUp=()=>authRequest('signup');
async function loadState(){try{const [profiles,wallets,trips,pub,asg]=await Promise.all([api(`profiles?id=eq.${session.user.id}&limit=1`),api(`point_wallets?user_id=eq.${session.user.id}&limit=1`),api(`trips?owner_id=eq.${session.user.id}&status=in.(active,in_progress)&order=departure_at.desc&limit=1`),api(`delivery_tasks?publisher_id=eq.${session.user.id}&select=*,assignments(*,carrier:profiles!assignments_carrier_id_fkey(display_name,avatar_url))&order=created_at.desc&limit=20`),api(`assignments?carrier_id=eq.${session.user.id}&select=*,delivery_tasks(*),publisher:profiles!assignments_publisher_id_fkey(display_name,avatar_url)&order=accepted_at.desc&limit=20`)]);profile=profiles?.[0]||{display_name:'新同学'};wallet=wallets?.[0]||{available:0,frozen:0};currentTrip=trips?.[0]||null;tripCreated=!!currentTrip;publishedTasks=pub||[];acceptedAssignments=asg||[];carryJoined=acceptedAssignments.some(a=>!a.delivered_at);if(carryJoined){const a=acceptedAssignments.find(x=>!x.delivered_at);currentTask=a.delivery_tasks}checkExpiredTasks();loadNotifications()}catch(e){console.warn(e)}}
// 到点检查：调用后端 RPC，把超过最晚接单时间仍未接单的 open 任务自动置为 expired，并生成通知
async function checkExpiredTasks(){try{const r=await authorizedFetch(`${SB_URL}/rest/v1/rpc/expire_tasks_if_timeout`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)return;loadNotifications()}catch(e){}}

function notifBadge(){const unread=(myNotifs||[]).filter(n=>!n.is_read).length;return`<button class="chip" style="position:relative" onclick="notifications()">🔔${unread?`<span style="position:absolute;top:-6px;right:-6px;background:#ff5a2d;color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;line-height:18px;text-align:center;padding:0 4px">${unread>99?'99+':unread}</span>`:''}</button>`}
async function notifications(){setNav('task');await loadNotifications();s.innerHTML=`<div class="top"><div><div class="muted">系统通知</div><h2>消息中心</h2></div><button class="chip" onclick="home()">返回</button></div>${myNotifs.length?myNotifs.map(n=>`<div class="card"><div class="meta"><span style="color:${n.type==='late_delivery'?'#aa3b22':'#a3622a'}">${n.type==='task_expired'?'⛔ 任务已取消':n.type==='late_delivery'?'⏰ 配送超时':'信息'}</span><span>${fmtDT(n.created_at)}</span></div><b>${esc(n.title)}</b><p class="muted">${esc(n.body)}</p></div>`).join(''):'<div class="card"><b>暂无通知</b><p class="muted">到点未接单的任务被自动取消、或配送超时提醒，都会出现在这里。</p></div>'}${myNotifs.some(n=>!n.is_read)?`<button class="secondary" onclick="markNotifsRead()">全部标记为已读</button>`:''}`;if(myNotifs.some(n=>!n.is_read))markNotifsRead()}
async function markNotifsRead(){const unread=(myNotifs||[]).filter(n=>!n.is_read).map(n=>n.id);if(!unread.length)return;try{await api(`notifications?id=in.(${unread.join(',')})`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_read:true})});myNotifs.forEach(n=>{if(unread.includes(n.id))n.is_read=true})}catch(e){}}
let myNotifs=[];

function account(msg=''){setNav('account');s.innerHTML=`<div class="top"><div><div class="muted">Supabase 账号</div><h2>我的</h2></div>${avatarHtml()}</div><div class="hero"><small>我的积分</small><strong>${wallet.available} 积分</strong><small>冻结 ${wallet.frozen} · 信誉分 ${Number(profile?.reputation_score||100).toFixed(0)}</small></div>${msg?`<div class="ai">${esc(msg)}</div>`:''}<div class="field"><label>昵称</label><input class="input" id="profileName" value="${esc(profile?.display_name||'')}"></div><div class="field"><label>校区</label><select class="input" id="profileCampus"><option value="">未设置</option><option value="central">中区</option><option value="high_tech">高新区</option><option value="east">东区</option><option value="west">西区</option></select></div><div class="field"><label>头像图片（最大 5 MB）</label><input class="input" id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="primary" onclick="saveProfile()">保存资料</button><div class="card"><b>${esc(session?.user?.email||'')}</b><p class="muted">注册邮箱 · 已完成 ${profile?.completed_orders||0} 单</p></div><button class="secondary" onclick="friendList()" style="background:#eaf4ec;color:#245434;font-weight:600">👥 好友管理</button><button class="secondary" onclick="changePassword()" style="background:#fff4ec;color:#a3622a;font-weight:600">🔑 修改密码</button><button class="secondary" onclick="logout()">退出登录</button>`;document.getElementById('profileCampus').value=profile?.campus||''}

async function submitReview(taskId,revieweeId){if(!_reviewRating)return toast('请先点击星星评分');const tags=[...document.querySelectorAll('#reviewTags .on')].map(b=>b.textContent);const comment=document.getElementById('reviewComment')?.value.trim()||'';try{const body={task_id:taskId,reviewer_id:session.user.id,reviewee_id:revieweeId,rating:_reviewRating,tags,comment:comment||null};await api('reviews',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});toast('评价已提交');reviewsCache[revieweeId]=null;setTimeout(()=>viewUserProfile(revieweeId),500)}catch(e){toast('提交失败：'+e.message)}}
async function advanceTask(id,status){try{const r=await authorizedFetch(`${SB_URL}/rest/v1/rpc/advance_delivery_task`,{method:'POST',body:JSON.stringify({p_task_id:id,p_next_status:status})});if(!r.ok)throw Error(await r.text());toast('配送状态已更新');setTimeout(()=>carrierTask(id),400)}catch(e){toast('更新失败：'+e.message)}}
async function confirmDelivery(id){try{const file=window._deliveryPhotoFile;if(!file)throw Error('请先拍摄送达照片');const photoUrl=await uploadFile(file,'delivery');await api(`assignments?task_id=eq.${id}&carrier_id=eq.${session.user.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({delivery_photo_url:photoUrl})});toast('照片已上传，等待发布者确认');carrierTask(id)}catch(e){toast('确认失败：'+e.message)}}
async function confirmDeliveryPhoto(id,photoUrl){if(!photoUrl)return toast('未找到送达照片，请先让带取人上传');try{const r=await authorizedFetch(`${SB_URL}/rest/v1/rpc/confirm_delivery`,{method:'POST',body:JSON.stringify({p_task_id:id,p_photo_url:photoUrl})});if(!r.ok)throw Error(await r.text());toast('确认成功，积分已到账');await loadState();setTimeout(()=>publisherTask(id),500)}catch(e){toast('确认失败：'+e.message)}}
async function completedOrders(){setNav('task');await loadState();var all=[];publishedTasks.forEach(function(t){var a=t.assignments?.[0];if(a?.delivered_at||t.status==='completed'||t.status==='cancelled'){all.push({type:'发布',title:t.title,pickup:t.pickup_name,dest:t.destination_name,points:a?.agreed_points||t.offered_points,status:a?.delivered_at?'已完成':statusText[t.status]||t.status,time:a?.delivered_at||t.updated_at,id:t.id,isPublisher:true,dt:t})}});acceptedAssignments.forEach(function(a){if(a.delivered_at||a.delivery_tasks?.status==='completed'||a.delivery_tasks?.status==='cancelled'){all.push({type:'带取',title:a.delivery_tasks?.title||'未知任务',pickup:a.delivery_tasks?.pickup_name||'',dest:a.delivery_tasks?.destination_name||'',points:a.agreed_points,status:a.delivered_at?'已完成':statusText[a.delivery_tasks?.status]||'已完成',time:a.delivered_at||a.updated_at,id:a.task_id,isPublisher:false,dt:a.delivery_tasks})}});all.sort(function(a,b){return new Date(b.time)-new Date(a.time)});var cards=all.map(function(o){var btn=o.isPublisher?'<button class="secondary" onclick="publisherTask(\''+esc(o.id)+'\')">查看详情</button>':'<button class="secondary" onclick="carrierTask(\''+esc(o.id)+'\')">查看详情</button>';return'<div class="card"><div class="meta"><span>'+esc(o.type)+'</span><span>'+esc(o.status)+'</span></div><b>'+esc(o.title)+'</b><p class="muted">'+esc(o.pickup)+' → '+esc(o.dest)+' · '+o.points+' 积分</p>'+taskTimeLine(o.dt)+btn+'</div>'}).join('');s.innerHTML='<div class="top"><div><div class="muted">历史订单</div><h2>已完成</h2></div><button class="chip" onclick="home()">返回</button></div><div class="tabs"><button onclick="home()">我发布的</button><button onclick="carrierHome()">我接受的</button><button class="active">已完成</button></div>'+(cards||'<div class="card"><b>暂无已完成订单</b><p class="muted">完成的发布和带取任务会显示在这里</p></div>')}
// ========== 好友系统 ==========
// 从数据库加载当前用户与目标用户的好友关系（双向查询）
async function loadFriendStatus(userId){try{var rows=await api('friends?or=(user_id.eq.'+session.user.id+',friend_id.eq.'+session.user.id+')&or=(user_id.eq.'+userId+',friend_id.eq.'+userId+')&limit=10');if(rows&&rows.length>0){var r=rows[0];if(r.user_id==session.user.id&&r.friend_id==userId){friendStatus[userId]=r.status}else if(r.user_id==userId&&r.friend_id==session.user.id){friendStatus[userId]=r.status=='pending'?'friend_requested':r.status}else{delete friendStatus[userId]}}else{delete friendStatus[userId]}}catch(e){}}
function addFriend(userId){if(friendStatus[userId]==='accepted')return toast('已经是好友了');api('friends',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:session.user.id,friend_id:userId,status:'pending'})}).then(function(){friendStatus[userId]='pending';toast('好友请求已发送');viewUserProfile(userId)}).catch(function(e){toast('操作失败：'+e.message)})}
function acceptFriend(userId,backToList){api('friends?or=(user_id.eq.'+userId+',friend_id.eq.'+userId+')&or=(user_id.eq.'+session.user.id+',friend_id.eq.'+session.user.id+')&limit=1').then(function(rows){if(!rows||!rows.length)return toast('未找到好友请求');var r=rows[0];api('friends?id=eq.'+r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'accepted'})}).then(function(){return api('friends?or=(user_id.eq.'+session.user.id+',friend_id.eq.'+session.user.id+')&or=(user_id.eq.'+userId+',friend_id.eq.'+userId+')&status=eq.pending&id=neq.'+r.id,{method:'DELETE'}).catch(function(){})}).then(function(){friendStatus[userId]='accepted';toast('已接受好友请求');if(backToList){friendList()}else{viewUserProfile(userId)}}).catch(function(e){toast('操作失败：'+e.message)})}).catch(function(e){toast('操作失败：'+e.message)})}
function toggleFavorite(userId){api('friends?or=(user_id.eq.'+session.user.id+',friend_id.eq.'+session.user.id+')&or=(user_id.eq.'+userId+',friend_id.eq.'+userId+')&limit=1').then(function(rows){if(!rows||!rows.length)return toast('请先加好友');var r=rows[0];var newS=r.status==='favorite'?'accepted':'favorite';api('friends?id=eq.'+r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:newS})}).then(function(){friendStatus[userId]=newS;toast(newS==='favorite'?'已设为特别关心':'取消特别关心');viewUserProfile(userId)}).catch(function(e){toast('操作失败：'+e.message)})}).catch(function(e){toast('操作失败：'+e.message)})}
function blockFriend(userId){api('friends?or=(user_id.eq.'+session.user.id+',friend_id.eq.'+session.user.id+')&or=(user_id.eq.'+userId+',friend_id.eq.'+userId+')&limit=1').then(function(rows){if(rows&&rows.length>0){var r=rows[0];api('friends?id=eq.'+r.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:'blocked'})}).then(function(){friendStatus[userId]='blocked';toast('已拉黑');viewUserProfile(userId)}).catch(function(e){toast('操作失败：'+e.message)})}else{api('friends',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:session.user.id,friend_id:userId,status:'blocked'})}).then(function(){friendStatus[userId]='blocked';toast('已拉黑');viewUserProfile(userId)}).catch(function(e){toast('操作失败：'+e.message)})}}).catch(function(e){toast('操作失败：'+e.message)})}
function removeFriend(userId){api('friends?or=(user_id.eq.'+session.user.id+',friend_id.eq.'+session.user.id+')&or=(user_id.eq.'+userId+',friend_id.eq.'+userId+')&limit=1').then(function(rows){if(!rows||!rows.length)return toast('未找到好友关系');var r=rows[0];api('friends?id=eq.'+r.id,{method:'DELETE',headers:{Prefer:'return=minimal'}}).then(function(){delete friendStatus[userId];toast('已移除');viewUserProfile(userId)}).catch(function(e){toast('操作失败：'+e.message)})}).catch(function(e){toast('操作失败：'+e.message)})}
async function friendList(){setNav('account');try{var rows=await api('friends?or=(user_id.eq.'+session.user.id+',friend_id.eq.'+session.user.id+')&select=id,user_id,friend_id,status&order=created_at.desc&limit=50');if(!rows||!rows.length){s.innerHTML='<div class="top"><div><div class="muted">社交</div><h2>好友管理</h2></div><button class="chip" onclick="account()">返回</button></div><div class="card"><b>暂无好友</b><p class="muted">在用户主页可以添加好友</p></div>';return}var ids=[];rows.forEach(function(r){var otherId=r.user_id===session.user.id?r.friend_id:r.user_id;ids.push(otherId)});var profiles=await api('profiles?id=in.('+ids.join(',')+')&select=id,display_name,avatar_url,reputation_score');var pmap={};(profiles||[]).forEach(function(p){pmap[p.id]=p});var cards=rows.map(function(r){var otherId=r.user_id===session.user.id?r.friend_id:r.user_id;var p=pmap[otherId]||{display_name:'未知',avatar_url:null,reputation_score:100};var statusLabel={'pending':'待确认','accepted':'好友','favorite':'⭐ 特别关心','blocked':'🚫 已拉黑'}[r.status]||r.status;var incomingPending=r.status==='pending'&&r.user_id!==session.user.id;var actionBtn=incomingPending?'<button class="primary" style="margin-top:10px;width:100%" onclick="event.stopPropagation();acceptFriend(\''+esc(otherId)+'\',true)">✓ 接受好友请求</button>':'';return'<div class="card" style="cursor:pointer" onclick="viewUserProfile(\''+esc(otherId)+'\')"><div style="display:flex;align-items:center;gap:12px">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" style="width:40px;height:40px;border-radius:12px;object-fit:cover">':'<div style="width:40px;height:40px;border-radius:12px;background:#ffdf6d;display:grid;place-items:center;font-weight:700;font-size:16px">'+esc(p.display_name.slice(0,1))+'</div>')+'<div><b>'+esc(p.display_name)+'</b><div class="muted">'+statusLabel+' · 信誉分 '+Number(p.reputation_score||100).toFixed(0)+'</div></div></div></div>'+actionBtn+'</div>'}).join('');s.innerHTML='<div class="top"><div><div class="muted">社交</div><h2>好友管理</h2></div><button class="chip" onclick="account()">返回</button></div>'+(cards||'<div class="card"><b>暂无好友</b><p class="muted">在用户主页可以添加好友</p></div>')}catch(e){s.innerHTML='<div class="top"><h2>好友管理</h2><button class="chip" onclick="account()">返回</button></div><div class="error">'+esc(e.message)+'</div>'}}
function changePassword(){setNav('account');s.innerHTML='<div class="top"><div><div class="muted">账号安全</div><h2>修改密码</h2></div><button class="chip" onclick="account()">返回</button></div><div class="field"><label>当前密码</label><input class="input" id="oldPw" type="password" placeholder="输入当前密码"></div><div class="field"><label>新密码</label><input class="input" id="newPw" type="password" placeholder="至少 6 位"></div><div class="field"><label>确认新密码</label><input class="input" id="confirmPw" type="password" placeholder="再次输入新密码"></div><button class="primary" onclick="submitPasswordChange()">更新密码</button>'}
async function submitPasswordChange(){var old=document.getElementById('oldPw').value;var pw=document.getElementById('newPw').value;var confirm=document.getElementById('confirmPw').value;if(!old||pw.length<6||pw!==confirm)return toast('请填写所有字段，新密码至少6位且两次输入一致');try{var r=await fetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SB_KEY,'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({password:pw})});if(!r.ok)throw Error((await r.json()).msg||'修改失败');toast('密码已修改，下次登录请使用新密码');setTimeout(account,500)}catch(e){toast(e.message)}}

function carryNegotiate(){s.innerHTML=`<div class="top"><div><div class="muted">与周同学的协商</div><h2>Agent 对话</h2></div><button class="chip" onclick="takeDetail()">设置</button></div><div class="chat"><div class="bubble left"><div class="who">周同学的任务 Agent</div>咖啡从东门送到图书馆南门，报价 18 积分，18:35 前送达。</div><div class="bubble right"><div class="who">陈同学的行程 Agent</div>路线重合 89%，绕行 120 米，没有超过陈同学设置的 200 米；当前无雨，18 积分达到最低接受值。</div><div class="bubble right"><div class="who">陈同学的行程 Agent</div>时间窗也兼容，我方可以接受。</div><div class="bubble left"><div class="who">周同学的任务 Agent</div>好的，18 积分成交。请陈同学确认接单后再加入行程。</div></div><div class="ai">✓ 协商完成 · 等待陈同学最终确认</div><button class="primary" onclick="acceptCarry()">我要接单</button><button class="secondary" onclick="takeDetail()">重新设置条件</button>`}
function newTrip(){setNav('trip');s.innerHTML=`<div class="top"><div><div class="muted">添加路线</div><h2>创建我的行程</h2></div><button class="chip" onclick="home()">取消</button></div><div class="field"><label>从哪里出发</label><input class="input" id="tripOrigin" value="东门"></div><div class="field"><label>要去哪里</label><input class="input" id="tripDest" value="图书馆"></div><div class="field"><label>出发时间</label><input class="input" id="tripTime" type="datetime-local"></div><div class="field"><label>校区</label><select class="input" id="tripCampus"><option value="east">东区</option><option value="central">中区</option><option value="high_tech">高新区</option><option value="west">西区</option></select></div><div class="field"><label>愿意最多绕行（米）</label><input class="input" id="tripDetour" type="number" value="200"></div><div class="field"><label>最多顺带</label><input class="input" id="tripMax" type="number" value="1"></div><button class="primary" onclick="saveTrip()">保存并开启智能匹配</button>`;const d=new Date(Date.now()+30*60000);document.getElementById('tripTime').value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
async function saveTrip(){try{const originName=document.getElementById('tripOrigin').value,destName=document.getElementById('tripDest').value;const body={owner_id:session.user.id,origin_name:originName,destination_name:destName,campus:document.getElementById('tripCampus').value,departure_at:new Date(document.getElementById('tripTime').value).toISOString(),max_detour_m:+document.getElementById('tripDetour').value,max_tasks:+document.getElementById('tripMax').value,status:'active'};const rows=await api('trips',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});currentTrip=rows[0];tripCreated=true;toast('行程已保存');setTimeout(available,500)}catch(e){toast('保存失败：'+e.message)}}
 function trip(){setNav('trip');if(!tripCreated)return newTrip();const a=acceptedAssignments.find(x=>!x.delivered_at),t=a?.delivery_tasks,owner=profile?.display_name||'我',depart=currentTrip?.departure_at?new Date(currentTrip.departure_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'待定';s.innerHTML=`<div class="top"><div><div class="muted">${esc(owner)}的行程 · ${depart} 出发</div><h2>${esc(currentTrip.origin_name)} → ${esc(currentTrip.destination_name)}</h2></div><button class="chip" onclick="newTrip()">编辑</button></div><div id="amapTrip" class="amap-wrap"><div class="ai" style="margin:0;height:100%;justify-content:center">高德地图加载中…</div></div>${t?`<div class="card"><b>进行中 · ${esc(t.title)}</b><p class="muted">${esc(t.pickup_name)} → ${esc(t.destination_name)}</p><div class="meta"><span>${statusText[t.status]||t.status}</span><span>${a.agreed_points} 积分</span></div></div><button class="primary" onclick="carrierTask('${t.id}')">继续履约</button>`:'<div class="card"><b>当前没有已接任务</b><p class="muted">Agent 正在根据路线寻找可接任务。</p></div><button class="primary" onclick="available()">查看匹配结果</button>'}<button class="secondary" onclick="home()">返回任务广场</button>`;setTimeout(function(){showAmapRoute('amapTrip',currentTrip.origin_name,currentTrip.destination_name,t?.pickup_name||null,currentTrip.campus)},200)}
async function available(){setNav('pool');await loadState();if(!tripCreated)return newTrip();if(carryJoined){const active=acceptedAssignments.find(a=>!a.delivered_at);return s.innerHTML=`<div class="top"><div><div class="muted">行程正在使用中</div><h2>没有可用行程</h2></div><button class="chip" onclick="carrierHome()">返回</button></div><div class="card"><b>${esc(active?.delivery_tasks?.title||'当前任务尚未完成')}</b><p class="muted">完成取货、配送、送达并核验交付码后，此行程才会结束。结束后请创建新行程再接下一单。</p></div><button class="primary" onclick="carrierTask('${active?.task_id}')">继续当前订单</button>`}try{const qs=`delivery_tasks?status=eq.open&publisher_id=neq.${session.user.id}&order=deadline_at.asc&limit=1`;const rows=await api(qs);if(rows?.length){currentTask=rows[0];s.innerHTML=`<div class="top"><div><div class="muted">基于 ${esc(currentTrip.origin_name)} → ${esc(currentTrip.destination_name)}</div><h2>我可接的</h2></div><button class="chip" onclick="trip()">行程</button></div><div class="match"><div class="muted" style="color:#bcd0c1">Agent 最佳推荐</div><div class="score">89%</div><b>${esc(currentTask.title)}</b><p style="font-size:12px;color:#c7d7cb">${esc(currentTask.pickup_name)} → ${esc(currentTask.destination_name)} · ${currentTask.offered_points} 积分</p>${taskTimeLine(currentTask)}</div><button class="primary" onclick="takeDbTask()">采用智能推荐</button><button class="secondary" onclick="pool()">浏览全部任务</button>`}else{s.innerHTML=`<div class="top"><div><h2>我可接的</h2></div><button class="chip" onclick="trip()">行程</button></div><div class="card"><b>暂时没有公开任务</b><p class="muted">请使用另一个账号发布任务。</p></div><button class="secondary" onclick="pool()">打开任务池</button>`}}catch(e){toast('读取失败：'+e.message)}}
 function takeDbTask(){setNav('pool');s.innerHTML=`<div class="top"><div><div class="muted">公开任务</div><h2>${esc(currentTask.title)}</h2></div><button class="chip" onclick="pool()">返回任务池</button></div><div class="match"><b>${esc(currentTask.pickup_name)} → ${esc(currentTask.destination_name)}</b><p style="font-size:12px;color:#c7d7cb">发布方报价 ${currentTask.offered_points}–${currentTask.max_points} 积分</p>${taskTimeLine(currentTask)}</div><div class="card"><b>设置我的接单条件</b><div class="field"><label>最低接受积分</label><input class="input" id="carrierMin" type="number" value="${currentTask.offered_points}"></div><div class="field"><label><input id="carrierAllowRain" type="checkbox" checked> 雨天补偿</label><input class="input" id="carrierRain" type="number" min="0" value="3"></div><div class="field"><label><input id="carrierAllowWait" type="checkbox" checked> 等待超时补偿</label><input class="input" id="carrierWait" type="number" min="0" value="2"></div><div class="field"><label><input id="carrierAllowDetour" type="checkbox" checked> 绕行较远补偿</label><input class="input" id="carrierDetour" type="number" min="0" value="2"></div><div class="field"><label><input id="carrierAllowNight" type="checkbox"> 夜间配送补偿</label><input class="input" id="carrierNight" type="number" min="0" value="3"></div></div><button class="primary" onclick="dbNegotiate()">按这些条件开始协商</button>`}

 let poolCampus='',poolTasks=[];function setCampus(v,e){poolCampus=v;pick(e);loadPool()}function openPoolTask(id){const t=poolTasks.find(x=>x.id===id);if(!t)return toast('任务状态已变化，请刷新任务池');if(t.publisher_id===session.user.id)return toast('这是你自己发布的任务，不能接单');if(!currentTrip){toast('请先创建行程再接单');return setTimeout(newTrip,600)}currentTask=t;takeDbTask()}async function loadPool(){try{const key=document.getElementById('poolKey')?.value.trim()||'';let q='delivery_tasks?status=eq.open&order=deadline_at.asc&limit=20';if(poolCampus)q+=`&campus=eq.${poolCampus}`;if(key)q+=`&or=(title.ilike.*${encodeURIComponent(key)}*,pickup_name.ilike.*${encodeURIComponent(key)}*,destination_name.ilike.*${encodeURIComponent(key)}*)`;poolTasks=await api(q)||[];document.getElementById('poolList').innerHTML=poolTasks.length?poolTasks.map(t=>`<div class="card" style="cursor:pointer" onclick="openPoolTask('${t.id}')"><b>${esc(t.title)}</b><p class="muted">${esc(t.pickup_name)} → ${esc(t.destination_name)}</p><div class="meta"><span>${new Date(t.deadline_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} 前</span><span>${t.offered_points} 积分</span><span>${({central:'中区',high_tech:'高新区',east:'东区',west:'西区'})[t.campus]||'未分区'}</span></div>${taskTimeLine(t)}<button class="primary" style="margin-top:12px" onclick="event.stopPropagation();openPoolTask('${t.id}')">查看并协商接单</button></div>`).join(''):'<div class="card"><b>暂无符合条件的任务</b></div>'}catch(e){document.getElementById('poolList').innerHTML=`<div class="error">${esc(e.message)}</div>`}}

async function createPublishedTask(){try{toast(pendingOrderFile?'正在上传截图…':'正在发布…');const image_url=pendingOrderFile?await uploadFile(pendingOrderFile,'order'):null;function dtVal(id){const v=document.getElementById(id)?.value;return v?new Date(v).toISOString():null}const body={publisher_id:session.user.id,title:document.getElementById('taskTitle').value,pickup_name:document.getElementById('taskPickup').value,destination_name:document.getElementById('taskDest').value,campus:document.getElementById('taskCampus').value,deadline_at:new Date(Date.now()+45*60000).toISOString(),estimated_arrival_at:dtVal('taskEstArrival'),latest_accept_at:dtVal('taskLatestAccept'),latest_delivery_at:dtVal('taskLatestDelivery'),offered_points:+document.getElementById('taskPoints').value,max_points:+document.getElementById('taskMaxPoints').value,status:'open',timeout_penalty:timeoutPenalty,timeout_cancel:timeoutCancel,timeout_grace_minutes:timeoutCancel==='grace'?(parseInt(document.getElementById('taskTimeoutGrace').value)||0):0,timeout_penalty_rate:100,image_url,allow_rain_surcharge:document.getElementById('pubRain').checked,rain_surcharge_max:+document.getElementById('pubRainMax').value,allow_wait_surcharge:document.getElementById('pubWait').checked,allow_detour_surcharge:document.getElementById('pubDetour').checked,allow_night_surcharge:document.getElementById('pubNight').checked};if(body.max_points<body.offered_points)throw Error('最高积分不能低于基础积分');if(timeoutCancel==='grace'&&body.timeout_grace_minutes<0)throw Error('宽限分钟数不能为负数');if(body.latest_accept_at&&body.latest_delivery_at&&new Date(body.latest_accept_at)>new Date(body.latest_delivery_at))throw Error('最晚可接受接单时间不能晚于最晚可接受送达时间');if(body.estimated_arrival_at&&body.latest_delivery_at&&new Date(body.estimated_arrival_at)>new Date(body.latest_delivery_at))throw Error('预计送达时间不能晚于最晚可接受送达时间');const rows=await api('delivery_tasks',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});currentTask=rows[0];toast('任务与协商 ')===0){var parts=path.split('&');var fid='';parts.forEach(function(p){if(p.indexOf('friend_id=eq.')===0)fid=p.split('friend_id=eq.')[1]});delete friendStatus[fid];var idx=mockFriends.findIndex(function(f){return f.friend_id===fid});if(idx>=0)mockFriends.splice(idx,1);return null}return null}if(path.indexOf('profiles?id=eq.')===0){var pid=path.split('id=eq.')[1].split('&')[0];if(pid===uid)return[profile];if(profileCache[pid])return[profileCache[pid]];return[profile]}if(path.indexOf('point_wallets?user_id=eq.')===0){return[wallet]}if(path.indexOf('trips?owner_id=eq.')===0){return currentTrip?[currentTrip]:[]}if(path.indexOf('delivery_tasks?publisher_id=eq.')===0){return publishedTasks}if(path.indexOf('assignments?carrier_id=eq.')===0){return acceptedAssignments}if(path.indexOf('delivery_tasks?status=eq.open')===0){return mockOpen}if(path.indexOf('assignments?task_id=eq.')===0){return[]}if(path==='reviews'){var b=JSON.parse(opt.body||'{}');if(!mockReviews[b.reviewee_id])mockReviews[b.reviewee_id]=[];mockReviews[b.reviewee_id].push({id:'rev-'+Date.now(),created_at:new Date().toISOString(),...b});return[mockReviews[b.reviewee_id].at(-1)]}if(path.indexOf('reviews?reviewee_id=eq.')===0){var ruid=path.split('reviewee_id=eq.')[1].split('&')[0];return mockReviews[ruid]||[]}if(path.indexOf('friends?user_id=eq.')===0){return mockFriends}return[]};authorizedFetch=async function(url,opt){opt=opt||{};if(url.indexOf('/rpc/')>=0){await new Promise(function(r){setTimeout(r,150)});var rpc=url.split('/rpc/')[1].split('?')[0];if(rpc==='get_delivery_code'){return{ok:true,json:async function(){return'1234'},text:async function(){return'"1234"'},clone:function(){return{text:async function(){return''}}}}}if(rpc==='get_publisher_task_detail'){var task=publishedTasks[0];if(!task){task={id:'demo-task',title:'测试任务',pickup_name:'北门',destination_name:'西区',status:'completed',image_url:null}}return{ok:true,json:async function(){return{task:task,assignment:{delivered_at:null,agreed_points:25},carrier:{display_name:'林同学'},code:null,events:[]}},text:async function(){return'{}'},clone:function(){return{text:async function(){return''}}}}}if(rpc==='accept_delivery_task'){carryJoined=true;return{ok:true,text:async function(){return'{}'},clone:function(){return{text:async function(){return''}}}}}if(rpc==='advance_delivery_task'||rpc==='confirm_delivery'){return{ok:true,text:async function(){return'{}'},clone:function(){return{text:async function(){return''}}}}}return{ok:true,text:async function(){return'{}'},clone:function(){return{text:async function(){return''}}}}}if(url.indexOf('/storage/v1/object/')>=0){return{ok:true,text:async function(){return'{}'},clone:function(){return{text:async function(){return''}}}}}return{ok:false,status:401,text:async function(){return'demo mode'},clone:function(){return{text:async function(){return''}}}}};uploadFile=async function(file,folder){toast('Demo 模式：图片上传已跳过');return null};saveProfile=async function(){var n=document.getElementById('profileName');if(n){n=n.value.trim()}var c=document.getElementById('profileCampus');if(c){c=c.value}if(n){profile.display_name=n}if(c){profile.campus=c}account('Demo 模式：资料已保存')};nav.style.display='flex';home()}

function locateTripOrigin(){if(!navigator.geolocation)return toast('当前浏览器不支持定位');const btn=document.getElementById('locateTripBtn');if(btn){btn.disabled=true;btn.textContent='正在获取位置…'}navigator.geolocation.getCurrentPosition(async pos=>{pendingTripLocation={lng:pos.coords.longitude,lat:pos.coords.latitude,accuracy:pos.coords.accuracy};let name='我的当前位置';try{const r=await fetch(`https://restapi.amap.com/v3/geocode/regeo?key=${AMAP_KEY}&location=${pendingTripLocation.lng},${pendingTripLocation.lat}&radius=200&extensions=base`),d=await r.json();if(d.status==='1'&&d.regeocode?.formatted_address)name=d.regeocode.formatted_address}catch(e){}const input=document.getElementById('tripOrigin');if(input)input.value=name;if(btn){btn.disabled=false;btn.textContent=`已定位（精度约 ${Math.round(pendingTripLocation.accuracy)} 米）`}toast('已使用设备当前位置作为行程起点')},err=>{if(btn){btn.disabled=false;btn.textContent='使用我的当前位置'}const msg={1:'你拒绝了定位权限',2:'暂时无法获取位置',3:'定位超时'}[err.code]||err.message;toast(msg+'；请检查浏览器定位权限')},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
const newTripLocationBase=newTrip;newTrip=function(){pendingTripLocation=null;newTripLocationBase();const origin=document.getElementById('tripOrigin')?.closest('.field');if(origin)origin.insertAdjacentHTML('afterend','<button class="secondary" id="locateTripBtn" onclick="locateTripOrigin()">使用我的当前位置</button><p class="muted">定位只在你授权后获取，并作为本次行程起点保存。</p>')}
saveTrip=async function(){try{const originName=document.getElementById('tripOrigin').value.trim(),destName=document.getElementById('tripDest').value.trim();if(!originName||!destName)throw Error('请填写出发地和目的地');const dest=await amapGeo(destName),origin=pendingTripLocation||await amapGeo(originName);const body={owner_id:session.user.id,origin_name:originName,origin_lng:origin.ok?origin.lng:origin.lng||null,origin_lat:origin.ok?origin.lat:origin.lat||null,destination_name:destName,destination_lng:dest.ok?dest.lng:null,destination_lat:dest.ok?dest.lat:null,campus:document.getElementById('tripCampus').value,departure_at:new Date(document.getElementById('tripTime').value).toISOString(),max_detour_m:+document.getElementById('tripDetour').value,max_tasks:+document.getElementById('tripMax').value,status:'active'};const rows=await api('trips',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});currentTrip=rows[0];tripCreated=true;toast(pendingTripLocation?'行程已保存，起点使用真实定位':'行程已保存');setTimeout(available,500)}catch(e){toast('保存失败：'+e.message)}}
async function showLocatedTripRoute(){if(!currentTrip?.origin_lng||!currentTrip?.origin_lat||!window.AMap)return;const dest=currentTrip.destination_lng&&currentTrip.destination_lat?[+currentTrip.destination_lng,+currentTrip.destination_lat]:null;if(!dest)return;const origin=[+currentTrip.origin_lng,+currentTrip.origin_lat],map=new AMap.Map('amapTrip',{zoom:16,center:origin,resizeEnable:true,mapStyle:'amap://styles/light'}),start=new AMap.Marker({position:origin,label:{content:'<div style="background:#183c2a;color:white;padding:3px 7px;border-radius:8px">我的位置</div>',direction:'top'}}),end=new AMap.Marker({position:dest});map.add([start,end]);AMap.plugin('AMap.Walking',()=>new AMap.Walking({map,panel:null}).search(origin,dest));map.setFitView([start,end],false,[30,30,30,30]);if(window._amapInstances?.amapTrip)window._amapInstances.amapTrip.destroy();window._amapInstances=window._amapInstances||{};window._amapInstances.amapTrip=map}
const tripLocatedBase=trip;trip=function(){tripLocatedBase();if(currentTrip?.origin_lng&&currentTrip?.origin_lat)setTimeout(showLocatedTripRoute,450)}
let notificationPollTimer=null,lastFavoriteNotificationId=null;function startNotificationPolling(){if(notificationPollTimer)clearInterval(notificationPollTimer);const first=(myNotifs||[]).find(n=>n.type==='favorite_task');lastFavoriteNotificationId=first?.id||null;notificationPollTimer=setInterval(async()=>{if(!session)return;try{const rows=await api(`notifications?user_id=eq.${session.user.id}&type=eq.favorite_task&order=created_at.desc&limit=1`),latest=rows?.[0];if(latest&&latest.id!==lastFavoriteNotificationId){lastFavoriteNotificationId=latest.id;myNotifs.unshift(latest);toast('特别关心发布了新任务：'+latest.title)}}catch(e){}},20000)}
async function boot(){try{s.innerHTML='';const saved=JSON.parse(localStorage.getItem('shundai_session')||'null');if(!saved?.access_token){authView();return}session=saved;if(!session.expires_at||session.expires_at*1000<Date.now()+60000)await refreshSession();await loadState();nav.style.display='flex';home();startNotificationPolling()}catch(e){localStorage.removeItem('shundai_session');authView('登录状态已失效，请重新登录。')}}boot();
</script></body></html>
