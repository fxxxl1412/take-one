*{box-sizing:border-box}body{margin:0;background:#eef1eb;color:#172019;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:1fr 420px 1fr;gap:40px;align-items:center;padding:32px}.story{max-width:420px;justify-self:end}.eyebrow{font-size:12px;letter-spacing:.2em;color:#55705a;font-weight:700}.story h1{font-size:44px;line-height:1.05;margin:14px 0}.story p{color:#637067;line-height:1.8}.flow{display:grid;gap:10px;margin-top:28px}.flow div{padding:13px 16px;border-left:2px solid #c9d2c6;color:#7b857d}.flow .on{border-color:#ff6a3d;color:#172019;font-weight:700;background:#fff;border-radius:0 12px 12px 0}.phone{width:390px;height:800px;background:#f8faf6;border:10px solid #172019;border-radius:42px;box-shadow:0 30px 80px #33443933;overflow:hidden;position:relative}.status{height:34px;padding:10px 22px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700}.screen{height:690px;overflow:auto;padding:12px 18px 110px}.screen::-webkit-scrollbar{display:none}.top{display:flex;justify-content:space-between;align-items:center}.top h2{margin:5px 0;font-size:24px}.avatar{width:40px;height:40px;border-radius:14px;background:#ffdf6d;display:grid;place-items:center;font-weight:800}.hero{background:#183c2a;color:white;padding:20px;border-radius:24px;margin:20px 0;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-25px;top:-25px;background:#ff6a3d}.hero small{color:#bcd0c1}.hero strong{display:block;font-size:27px;margin:7px 0}.tabs{display:flex;gap:8px}.tabs button,.chip{border:0;border-radius:99px;padding:9px 14px;background:#e5eae3;color:#56615a}.tabs .active{background:#172019;color:white}.card{background:white;border:1px solid #e2e6df;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 20px #25372b0a}.route{display:grid;grid-template-columns:24px 1fr;gap:6px}.dot{width:10px;height:10px;border-radius:50%;background:#ff6a3d;margin-top:5px;box-shadow:0 24px 0 #183c2a}.line{font-size:15px;font-weight:700}.muted{font-size:12px;color:#7a847d;margin-top:4px}.meta{display:flex;gap:8px;margin-top:15px}.meta span{background:#f0f3ed;border-radius:8px;padding:6px 8px;font-size:11px}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:#ff6a3d;color:white;font-weight:800;font-size:15px;cursor:pointer}.secondary{width:100%;border:1px solid #dbe1da;border-radius:15px;padding:14px;background:white;font-weight:700;cursor:pointer;margin-top:8px}.nav{position:absolute;bottom:0;left:0;right:0;height:84px;background:#fff;border-top:1px solid #e3e7e1;display:flex;justify-content:space-around;padding-top:14px}.nav button{border:0;background:none;color:#8a938d;font-size:11px}.nav .active{color:#ff5a2d;font-weight:800}.icon{display:block;font-size:20px;margin-bottom:3px}.upload{border:1.5px dashed #afbbb0;border-radius:22px;padding:26px 12px;text-align:center;background:#fff}.upload b{font-size:30px;display:block;margin-bottom:8px}.voice{background:#183c2a;color:#fff;border-radius:18px;padding:16px;margin:12px 0;text-align:center}.field{background:white;border:1px solid #e1e5df;padding:13px;border-radius:13px;margin:9px 0}.field label{display:block;font-size:11px;color:#7d877f;margin-bottom:5px}.ai{display:flex;gap:9px;align-items:center;background:#eaf4ec;color:#245434;padding:12px;border-radius:14px;margin:12px 0;font-size:12px}.loader{width:16px;height:16px;border:2px solid #9fbaa5;border-top-color:#245434;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.match{background:#183c2a;color:white;border-radius:22px;padding:18px}.score{font-size:43px;font-weight:800;color:#ffdf6d}.agentlog{background:#101b14;color:#dce9df;border-radius:18px;padding:14px;font-family:monospace;font-size:11px;line-height:1.7;margin:12px 0}.agentlog i{color:#ffb298;font-style:normal}.progress{height:5px;background:#dfe5dc;border-radius:9px;margin:20px 0}.progress span{display:block;height:100%;background:#ff6a3d;border-radius:9px}.timeline{border-left:2px solid #dce3da;margin-left:7px}.event{padding:0 0 18px 18px;position:relative}.event:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#183c2a;left:-6px;top:3px}.event.now:before{background:#ff6a3d;box-shadow:0 0 0 5px #ff6a3d22}.code{font-size:30px;letter-spacing:.3em;text-align:center;font-weight:800;background:#fff;padding:18px;border-radius:18px}.aside{max-width:280px}.aside b{display:block;margin-bottom:12px}.aside p{font-size:13px;color:#647168;line-height:1.6}.tag{display:inline-block;background:#dfe8dd;padding:7px 10px;border-radius:9px;font-size:11px;margin:4px 2px}.toast{position:absolute;left:25px;right:25px;bottom:96px;background:#172019;color:#fff;padding:13px;border-radius:13px;text-align:center;font-size:12px;opacity:0;transform:translateY(15px);transition:.3s}.toast.show{opacity:1;transform:none}@media(max-width:980px){.shell{display:flex;justify-content:center;padding:10px}.story,.aside{display:none}.phone{height:calc(100vh - 20px);max-height:800px}}
.chat{display:flex;flex-direction:column;gap:12px;margin:14px 0}.bubble{max-width:85%;padding:12px 14px;border-radius:17px;font-size:12px;line-height:1.55}.bubble.left{align-self:flex-start;background:#fff;border:1px solid #dfe5dd;border-bottom-left-radius:5px}.bubble.right{align-self:flex-end;background:#183c2a;color:#fff;border-bottom-right-radius:5px}.who{font-size:10px;font-weight:800;color:#829087;margin-bottom:5px}.right .who{color:#bcd0c1}.choices{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.choices button{border:1px solid #d7ded5;background:#fff;padding:8px 10px;border-radius:10px;font-size:11px}.choices button.on{background:#183c2a;color:#fff;border-color:#183c2a}.map{height:190px;border-radius:22px;background:linear-gradient(25deg,#dfe9dc 25%,transparent 25%) 0 0/38px 38px,linear-gradient(155deg,#eaf0e7 25%,#f5f7f2 25%) 0 0/48px 48px;position:relative;overflow:hidden;border:1px solid #dbe2d8}.road{position:absolute;height:7px;background:#fff;border:1px solid #d5dbd2;border-radius:9px;transform-origin:left}.road.a{width:300px;left:20px;top:132px;transform:rotate(-24deg)}.road.b{width:230px;left:100px;top:25px;transform:rotate(69deg)}.path{position:absolute;width:220px;height:90px;border-left:5px solid #1677ff;border-bottom:5px solid #1677ff;border-radius:0 0 0 35px;left:72px;top:44px;transform:rotate(-8deg)}.pin{position:absolute;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ff5f36;display:grid;place-items:center;color:#fff}.pin i{transform:rotate(45deg);font-size:10px;font-style:normal}.maplabel{position:absolute;background:#fff;padding:5px 7px;border-radius:7px;font-size:10px;box-shadow:0 3px 10px #24352822}
.input{width:100%;border:0;outline:0;background:transparent;font:inherit;color:#172019}.authmark{width:64px;height:64px;border-radius:22px;background:#183c2a;color:#fff;display:grid;place-items:center;font-size:28px;margin:28px auto 18px}.db{display:inline-flex;align-items:center;gap:5px;color:#31845a;font-size:10px}.db:before{content:"";width:7px;height:7px;border-radius:50%;background:#39b876}.error{background:#fff0ec;color:#aa3b22;padding:10px;border-radius:12px;font-size:11px;margin:10px 0}
</style></head>
<body><main class="shell"><section class="story"><div class="eyebrow">MULTI-AGENT CAMPUS DELIVERY</div><h1>让每一段顺路，<br>都成为校园运力。</h1><p>顺带连接需要取餐的人与恰好经过的人。智能体理解订单、计算绕行、协商积分，并全程守护交付。</p><div class="flow" id="flow"><div class="on">01 发现与发布</div><div>02 智能匹配</div><div>03 Agent 协商</div><div>04 实时履约</div></div></section><section class="phone"><div class="status"><span>18:02</span><span class="db">Supabase</span></div><div class="screen" id="screen"></div><nav class="nav" id="nav"><button class="active" onclick="home()"><span class="icon">⌂</span>任务</button><button onclick="publish()"><span class="icon">＋</span>发布</button><button onclick="trip()"><span class="icon">◎</span>行程</button><button onclick="pool()"><span class="icon">▦</span>任务池</button><button onclick="account()"><span class="icon">◉</span>我的</button></nav><div class="toast" id="toast"></div></section><aside class="aside"><b>数据已连接</b><span class="tag">Supabase Auth</span><span class="tag">Postgres + RLS</span><span class="tag">REST API</span></aside></main>
<script>
const SB_URL='https://kregjnadyzowwxwlmtyh.supabase.co';
const SB_KEY='sb_publishable_SVIRRJ-bALe4N8vESrN3FQ_BNxjn27J';
const s=document.getElementById('screen'),nav=document.getElementById('nav');let session=null,profile=null,wallet={available:0,frozen:0},currentTrip=null,currentTask=null,currentNegotiation=null,publishedTasks=[],acceptedAssignments=[];
const step=n=>document.querySelectorAll('#flow div').forEach((x,i)=>x.classList.toggle('on',i===n));function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function headers(extra={}){return {'apikey':SB_KEY,'Authorization':`Bearer ${session?.access_token||SB_KEY}`,'Content-Type':'application/json',...extra}}
let refreshPromise=null;async function refreshSession(){if(refreshPromise)return refreshPromise;refreshPromise=(async()=>{if(!session?.refresh_token)throw Error('登录已过期，请重新登录');const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});const d=await r.json();if(!r.ok||!d.access_token)throw Error(d.message||d.msg||'登录已过期，请重新登录');session=d;localStorage.setItem('shundai_session',JSON.stringify(d));return d})().finally(()=>refreshPromise=null);return refreshPromise}
async function authorizedFetch(url,opt={},retry=true){if(session?.expires_at&&session.expires_at*1000<Date.now()+60000)await refreshSession();let r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});if(retry&&(r.status===401||r.status===403)){const body=await r.clone().text();if(/expired|jwt/i.test(body)){await refreshSession();r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}})}}return r}
async function api(path,opt={}){const r=await authorizedFetch(`${SB_URL}/rest/v1/${path}`,opt);if(!r.ok)throw Error((await r.text())||`请求失败 ${r.status}`);const t=await r.text();return t?JSON.parse(t):null}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function authView(msg=''){nav.style.display='none';s.innerHTML=`<div class="authmark">顺</div><div style="text-align:center"><h2>登录顺带</h2><p class="muted">登录后，行程和任务会保存到 Supabase</p></div>${msg?`<div class="error">${esc(msg)}</div>`:''}<div class="field"><label>邮箱</label><input class="input" id="email" type="email" placeholder="name@example.com"></div><div class="field"><label>密码</label><input class="input" id="password" type="password" placeholder="至少 6 位"></div><button class="primary" onclick="signIn()">登录</button><button class="secondary" onclick="signUp()">注册新账号</button>`}
async function authRequest(kind){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6)return authView('请输入有效邮箱，密码至少 6 位。');try{const url=kind==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const r=await fetch(SB_URL+url,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{display_name:'陈同学'}})});const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch{}if(!r.ok)throw Error(d.msg||d.message||d.error_description||`Supabase 返回 ${r.status}`);if(!d.access_token){authView('注册成功，请先到邮箱点击确认链接再登录。');return}session=d;localStorage.setItem('shundai_session',JSON.stringify(d));await loadState();nav.style.display='flex';home()}catch(e){const network=/Failed to fetch|NetworkError|Load failed|connection/i.test(e.message);authView(network?'无法连接 Supabase。请在 Dashboard → Project Settings → Data API 重新复制 Project URL，并检查当前网络或代理。':e.message)}}
const signIn=()=>authRequest('signin'),signUp=()=>authRequest('signup');
async function loadState(){try{const [profiles,wallets,trips,pub,asg]=await Promise.all([api(`profiles?id=eq.${session.user.id}&limit=1`),api(`point_wallets?user_id=eq.${session.user.id}&limit=1`),api(`trips?owner_id=eq.${session.user.id}&status=in.(active,in_progress)&order=departure_at.desc&limit=1`),api(`delivery_tasks?publisher_id=eq.${session.user.id}&select=*,assignments(*,carrier:profiles!assignments_carrier_id_fkey(display_name,avatar_url))&order=created_at.desc&limit=20`),api(`assignments?carrier_id=eq.${session.user.id}&select=*,delivery_tasks(*),publisher:profiles!assignments_publisher_id_fkey(display_name,avatar_url)&order=accepted_at.desc&limit=20`)]);profile=profiles?.[0]||{display_name:'新同学'};wallet=wallets?.[0]||{available:0,frozen:0};currentTrip=trips?.[0]||null;tripCreated=!!currentTrip;publishedTasks=pub||[];acceptedAssignments=asg||[];carryJoined=acceptedAssignments.some(a=>!a.delivered_at);if(carryJoined){const a=acceptedAssignments.find(x=>!x.delivered_at);currentTask=a.delivery_tasks}}catch(e){console.warn(e)}}
function avatarHtml(p=profile){return p?.avatar_url?`<img src="${esc(p.avatar_url)}" style="width:40px;height:40px;border-radius:14px;object-fit:cover">`:`<div class="avatar">${esc((p?.display_name||'同').slice(0,1))}</div>`}
function account(msg=''){s.innerHTML=`<div class="top"><div><div class="muted">Supabase 账号</div><h2>我的</h2></div>${avatarHtml()}</div><div class="hero"><small>我的积分</small><strong>${wallet.available} 积分</strong><small>冻结 ${wallet.frozen} · 信誉分 ${Number(profile?.reputation_score||100).toFixed(0)}</small></div>${msg?`<div class="ai">${esc(msg)}</div>`:''}<div class="field"><label>昵称</label><input class="input" id="profileName" value="${esc(profile?.display_name||'')}"></div><div class="field"><label>校区</label><select class="input" id="profileCampus"><option value="">未设置</option><option value="central">中区</option><option value="high_tech">高新区</option><option value="east">东区</option><option value="west">西区</option></select></div><div class="field"><label>头像图片（最大 5 MB）</label><input class="input" id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="primary" onclick="saveProfile()">保存资料</button><div class="card"><b>${esc(session?.user?.email||'')}</b><p class="muted">注册邮箱 · 已完成 ${profile?.completed_orders||0} 单</p></div><button class="secondary" onclick="logout()">退出登录</button>`;document.getElementById('profileCampus').value=profile?.campus||''}
async function uploadFile(file,folder){const allowed=['image/jpeg','image/png','image/webp'];if(!allowed.includes(file.type))throw Error('只支持 JPEG、PNG、WebP 图片');if(file.size>5*1024*1024)throw Error('图片不能超过 5 MB');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');const path=`${session.user.id}/${folder}-${Date.now()}.${ext}`;const r=await authorizedFetch(`${SB_URL}/storage/v1/object/order-images/${path}`,{method:'POST',headers:{'Content-Type':file.type},body:file});if(!r.ok)throw Error(await r.text());return `${SB_URL}/storage/v1/object/public/order-images/${path}`}
async function saveProfile(){try{const file=document.getElementById('avatarFile').files[0];const avatar_url=file?await uploadFile(file,'avatar'):profile?.avatar_url||null;const body={display_name:document.getElementById('profileName').value.trim(),campus:document.getElementById('profileCampus').value||null,avatar_url};await api(`profiles?id=eq.${session.user.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});profile={...profile,...body};account('资料已保存')}catch(e){toast('保存失败：'+e.message)}}
function logout(){localStorage.removeItem('shundai_session');session=null;authView()}
let carryJoined=false,tripCreated=false;const statusText={open:'等待接单',matching:'匹配中',negotiating:'协商中',accepted:'带取人已接单',picked_up:'已取货',delivering:'配送中',completed:'已送达·待确认',cancelled:'已取消',disputed:'申诉中'};
async function home(){step(0);await loadState();const pub=publishedTasks.map(t=>{const a=t.assignments?.[0],carrier=a?.carrier,needsConfirm=t.status==='completed'&&!a?.delivered_at,label=a?.delivered_at?'已完成':statusText[t.status]||t.status,buttonText=a?.delivered_at?'已完成':needsConfirm?'查看交付码并确认':'查看实时状态';return `<div class="card"><b>${esc(t.title)}</b><p class="muted">${esc(t.pickup_name)} → ${esc(t.destination_name)}</p><div class="meta"><span>${label}</span><span>${t.offered_points} 积分</span>${carrier?`<span>带取：${esc(carrier.display_name)}</span>`:''}</div><button class="${needsConfirm?'primary':'secondary'}" style="margin-top:12px" onclick="publisherTask('${t.id}')">${buttonText}</button></div>`}).join('');s.innerHTML=`<div class="top"><div><div class="muted">晚上好，${esc(profile?.display_name||'同学')}</div><h2>顺带</h2></div>${avatarHtml()}</div><div class="hero"><small>我的校园互助</small><strong>${publishedTasks.length} 个发布 · ${acceptedAssignments.length} 个带取</strong><small>${wallet.available} 积分 · 信誉分 ${Number(profile?.reputation_score||100).toFixed(0)}</small></div><div class="tabs"><button class="active">我发布的</button><button onclick="carrierHome()">我接受的</button></div>${pub||'<div class="card"><b>还没有发布任务</b><p class="muted">上传订单截图或手动填写信息来发布。</p></div>'}<button class="primary" onclick="publish()">＋ 发布带取任务</button>`}
async function carrierHome(){await loadState();const cards=acceptedAssignments.map(a=>`<div class="card"><b>${esc(a.delivery_tasks.title)}</b><p class="muted">${esc(a.delivery_tasks.pickup_name)} → ${esc(a.delivery_tasks.destination_name)}</p><div class="meta"><span>${a.delivered_at?'已完成':statusText[a.delivery_tasks.status]}</span><span>${a.agreed_points} 积分</span></div><button class="secondary" onclick="carrierTask('${a.task_id}')">${a.delivered_at?'已完成':'继续履约'}</button></div>`).join('');s.innerHTML=`<div class="top"><div><div class="muted">${esc(profile.display_name)}</div><h2>我接受的</h2></div>${avatarHtml()}</div><div class="tabs"><button onclick="home()">我发布的</button><button class="active">我接受的</button></div>${cards||'<div class="card"><b>还没有接受任务</b><p class="muted">创建行程后，可以从任务池选择顺路任务。</p></div>'}<button class="primary" onclick="${tripCreated?'available()':'newTrip()'}">寻找可接任务</button>`}
async function getDeliveryCode(id){const r=await authorizedFetch(`${SB_URL}/rest/v1/rpc/get_delivery_code`,{method:'POST',body:JSON.stringify({p_task_id:id})});if(!r.ok)throw Error(await r.text());return await r.json()}
async function getPublisherDetail(id){const r=await authorizedFetch(`${SB_URL}/rest/v1/rpc/get_publisher_task_detail`,{method:'POST',body:JSON.stringify({p_task_id:id})});if(!r.ok)throw Error(await r.text());return await r.json()}
async function publisherTask(id){try{const d=await getPublisherDetail(id),t=d.task,a=d.assignment,carrier=d.carrier,code=d.code,events=d.events||[],label=a?.delivered_at?'已完成':statusText[t.status];s.innerHTML=`<div class="top"><div><div class="muted">${label}</div><h2>${esc(t.title)}</h2></div><button class="chip" onclick="home()">返回</button></div>${t.image_url?`<img src="${esc(t.image_url)}" style="width:100%;height:150px;object-fit:cover;border-radius:20px;margin:12px 0">`:''}<div class="card"><b>${esc(t.pickup_name)} → ${esc(t.destination_name)}</b><p class="muted">${carrier?`带取人：${esc(carrier.display_name)}`:'正在等待带取人接单'}</p><div class="meta"><span>${label}</span><span>${a?.agreed_points||t.offered_points} 积分</span></div></div>${a?`<div class="timeline">${events.map(e=>`<div class="event ${e===events.at(-1)?'now':''}"><b>${esc(e.note||e.event_type)}</b><div class="muted">${new Date(e.created_at).toLocaleString('zh-CN')}</div></div>`).join('')}</div>${code?`<div class="card"><b>请向送货人出示交付码</b><p class="muted">送货人输入一致后，订单、积分和行程会同时完成</p><div class="code">${String(code).split('').join(' ')}</div></div>`:'<div class="ai">✓ 此订单已经完成，交付码已销毁</div>'}`:''}<button class="secondary" onclick="publisherTask('${t.id}')">刷新状态</button>`}catch(e){s.innerHTML=`<div class="top"><h2>任务详情读取失败</h2><button class="chip" onclick="home()">返回</button></div><div class="error">${esc(e.message)}</div><button class="primary" onclick="publisherTask('${id}')">重新读取</button>`}}
async function carrierTask(id){try{const rows=await api(`assignments?task_id=eq.${id}&carrier_id=eq.${session.user.id}&select=*,delivery_tasks(*),publisher:profiles!assignments_publisher_id_fkey(display_name,avatar_url)`);const a=rows[0],t=a.delivery_tasks,publisher=a.publisher;let action='';if(t.status==='accepted')action=`<button class="primary" onclick="advanceTask('${id}','picked_up')">我已取货</button>`;else if(t.status==='picked_up')action=`<button class="primary" onclick="advanceTask('${id}','delivering')">开始配送</button>`;else if(t.status==='delivering')action=`<button class="primary" onclick="advanceTask('${id}','completed')">我已送达</button>`;else if(t.status==='completed'&&!a.delivered_at)action=`<div class="ai">请向发布者索取四位交付码</div><div class="field"><label>输入交付码</label><input class="input" id="confirmCode" inputmode="numeric" maxlength="4" placeholder="0000"></div><button class="primary" onclick="confirmDelivery('${id}')">核验交付码并完成订单</button>`;else action='<div class="ai">✓ 任务已完成，积分已到账，行程已结束</div>';s.innerHTML=`<div class="top"><div><div class="muted">${a.delivered_at?'已完成':statusText[t.status]}</div><h2>${esc(t.title)}</h2></div><button class="chip" onclick="carrierHome()">返回</button></div><div class="map"><div class="road a"></div><div class="road b"></div><div class="path"></div><div class="pin" style="left:60px;top:115px"><i>取</i></div><div class="pin" style="right:45px;top:42px;background:#183c2a"><i>送</i></div><div class="maplabel" style="left:20px;bottom:12px">${esc(t.pickup_name)} → ${esc(t.destination_name)}</div></div><div class="card"><b>发布者：${esc(publisher?.display_name||'同学')}</b><p class="muted">送到 ${esc(t.destination_name)} · ${a.agreed_points} 积分</p></div>${action}<button class="secondary" onclick="carrierTask('${id}')">刷新状态</button>`}catch(e){toast('读取任务失败：'+e.message)}}

 function trip(){if(!tripCreated)return newTrip();const a=acceptedAssignments.find(x=>!x.delivered_at),t=a?.delivery_tasks,owner=profile?.display_name||'我',depart=currentTrip?.departure_at?new Date(currentTrip.departure_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'待定';s.innerHTML=`<div class="top"><div><div class="muted">${esc(owner)}的行程 · ${depart} 出发</div><h2>${esc(currentTrip.origin_name)} → ${esc(currentTrip.destination_name)}</h2></div><button class="chip" onclick="newTrip()">编辑</button></div><div class="map"><div class="road a"></div><div class="road b"></div><div class="path"></div><div class="pin" style="left:60px;top:115px"><i>起</i></div><div class="pin" style="right:45px;top:42px;background:#183c2a"><i>终</i></div>${t?'<div class="pin" style="left:145px;top:82px;background:#ffb000"><i>取</i></div><div class="maplabel" style="left:172px;top:78px">'+esc(t.pickup_name)+'</div>':''}<div class="maplabel" style="left:20px;bottom:12px">高德地图路线预览</div></div>${t?`<div class="card"><b>进行中 · ${esc(t.title)}</b><p class="muted">${esc(t.pickup_name)} → ${esc(t.destination_name)}</p><div class="meta"><span>${statusText[t.status]||t.status}</span><span>${a.agreed_points} 积分</span></div></div><button class="primary" onclick="carrierTask('${t.id}')">继续履约</button>`:'<div class="card"><b>当前没有已接任务</b><p class="muted">Agent 正在根据路线寻找可接任务。</p></div><button class="primary" onclick="available()">查看匹配结果</button>'}<button class="secondary" onclick="home()">返回任务广场</button>`}
async function available(){await loadState();if(!tripCreated)return newTrip();if(carryJoined){const active=acceptedAssignments.find(a=>!a.delivered_at);return s.innerHTML=`<div class="top"><div><div class="muted">行程正在使用中</div><h2>没有可用行程</h2></div><button class="chip" onclick="carrierHome()">返回</button></div><div class="card"><b>${esc(active?.delivery_tasks?.title||'当前任务尚未完成')}</b><p class="muted">完成取货、配送、送达并核验交付码后，此行程才会结束。结束后请创建新行程再接下一单。</p></div><button class="primary" onclick="carrierTask('${active?.task_id}')">继续当前订单</button>`}try{const qs=`delivery_tasks?status=eq.open&publisher_id=neq.${session.user.id}&order=deadline_at.asc&limit=1`;const rows=await api(qs);if(rows?.length){currentTask=rows[0];s.innerHTML=`<div class="top"><div><div class="muted">基于 ${esc(currentTrip.origin_name)} → ${esc(currentTrip.destination_name)}</div><h2>我可接的</h2></div><button class="chip" onclick="trip()">行程</button></div><div class="match"><div class="muted" style="color:#bcd0c1">Agent 最佳推荐</div><div class="score">89%</div><b>${esc(currentTask.title)}</b><p style="font-size:12px;color:#c7d7cb">${esc(currentTask.pickup_name)} → ${esc(currentTask.destination_name)} · ${currentTask.offered_points} 积分</p></div><button class="primary" onclick="takeDbTask()">采用智能推荐</button><button class="secondary" onclick="pool()">浏览全部任务</button>`}else{s.innerHTML=`<div class="top"><div><h2>我可接的</h2></div><button class="chip" onclick="trip()">行程</button></div><div class="card"><b>暂时没有公开任务</b><p class="muted">请使用另一个账号发布任务。</p></div><button class="secondary" onclick="pool()">打开任务池</button>`}}catch(e){toast('读取失败：'+e.message)}}
 function takeDbTask(){s.innerHTML=`<div class="top"><div><div class="muted">公开任务</div><h2>${esc(currentTask.title)}</h2></div><button class="chip" onclick="pool()">返回任务池</button></div><div class="match"><b>${esc(currentTask.pickup_name)} → ${esc(currentTask.destination_name)}</b><p style="font-size:12px;color:#c7d7cb">发布方报价 ${currentTask.offered_points}–${currentTask.max_points} 积分</p></div><div class="card"><b>设置我的接单条件</b><div class="field"><label>最低接受积分</label><input class="input" id="carrierMin" type="number" value="${currentTask.offered_points}"></div><div class="field"><label><input id="carrierAllowRain" type="checkbox" checked> 雨天补偿</label><input class="input" id="carrierRain" type="number" min="0" value="3"></div><div class="field"><label><input id="carrierAllowWait" type="checkbox" checked> 等待超时补偿</label><input class="input" id="carrierWait" type="number" min="0" value="2"></div><div class="field"><label><input id="carrierAllowDetour" type="checkbox" checked> 绕行较远补偿</label><input class="input" id="carrierDetour" type="number" min="0" value="2"></div><div class="field"><label><input id="carrierAllowNight" type="checkbox"> 夜间配送补偿</label><input class="input" id="carrierNight" type="number" min="0" value="3"></div></div><button class="primary" onclick="dbNegotiate()">按这些条件开始协商</button>`}
async function pool(){s.innerHTML=`<div class="top"><div><div class="muted">实时公开任务</div><h2>任务池</h2></div><button class="chip" onclick="home()">关闭</button></div><div class="field"><label>搜索关键词</label><input class="input" id="poolKey" placeholder="咖啡、外卖柜、图书馆…" oninput="loadPool()"></div><div class="choices"><button class="on" onclick="setCampus('',this)">不限</button><button onclick="setCampus('central',this)">中区</button><button onclick="setCampus('high_tech',this)">高新区</button><button onclick="setCampus('east',this)">东区</button><button onclick="setCampus('west',this)">西区</button></div><div id="poolList"><div class="ai"><span class="loader"></span>从 Supabase 读取中</div></div>`;loadPool()}
 let poolCampus='',poolTasks=[];function setCampus(v,e){poolCampus=v;pick(e);loadPool()}function openPoolTask(id){const t=poolTasks.find(x=>x.id===id);if(!t)return toast('任务状态已变化，请刷新任务池');if(t.publisher_id===session.user.id)return toast('这是你自己发布的任务，不能接单');if(!currentTrip){toast('请先创建行程再接单');return setTimeout(newTrip,600)}currentTask=t;takeDbTask()}async function loadPool(){try{const key=document.getElementById('poolKey')?.value.trim()||'';let q='delivery_tasks?status=eq.open&order=deadline_at.asc&limit=20';if(poolCampus)q+=`&campus=eq.${poolCampus}`;if(key)q+=`&or=(title.ilike.*${encodeURIComponent(key)}*,pickup_name.ilike.*${encodeURIComponent(key)}*,destination_name.ilike.*${encodeURIComponent(key)}*)`;poolTasks=await api(q)||[];document.getElementById('poolList').innerHTML=poolTasks.length?poolTasks.map(t=>`<div class="card" style="cursor:pointer" onclick="openPoolTask('${t.id}')"><b>${esc(t.title)}</b><p class="muted">${esc(t.pickup_name)} → ${esc(t.destination_name)}</p><div class="meta"><span>${new Date(t.deadline_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} 前</span><span>${t.offered_points} 积分</span><span>${({central:'中区',high_tech:'高新区',east:'东区',west:'西区'})[t.campus]||'未分区'}</span></div><button class="primary" style="margin-top:12px" onclick="event.stopPropagation();openPoolTask('${t.id}')">查看并协商接单</button></div>`).join(''):'<div class="card"><b>暂无符合条件的任务</b></div>'}catch(e){document.getElementById('poolList').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function dbNegotiate(){try{const min=+document.getElementById('carrierMin').value,rain=+document.getElementById('carrierRain').value,allowRain=document.getElementById('carrierAllowRain').checked,allowWait=document.getElementById('carrierAllowWait').checked,allowDetour=document.getElementById('carrierAllowDetour').checked,allowNight=document.getElementById('carrierAllowNight').checked;let agreed=Math.max(currentTask.offered_points,min);if(allowRain&&currentTask.allow_rain_surcharge)agreed=Math.min(currentTask.max_points,agreed+Math.min(rain,currentTask.rain_surcharge_max||3));const accepted=agreed<=currentTask.max_points;const body={task_id:currentTask.id,trip_id:currentTrip.id,publisher_id:currentTask.publisher_id,carrier_id:session.user.id,publisher_max_points:currentTask.max_points,carrier_min_points:min,allow_rain_surcharge:allowRain,rain_surcharge:rain,allow_night_surcharge:allowNight,allow_detour_surcharge:allowDetour,allow_wait_surcharge:allowWait,wait_surcharge:2,agreed_points:accepted?agreed:null,status:accepted?'agreed':'rejected'};const n=await api('negotiations',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});currentNegotiation=n[0];const factors=[allowRain?'雨天':'',allowWait?'等待':'',allowDetour?'绕行':'',allowNight?'夜间':''].filter(Boolean).join('、');const publisherText=`发布方允许最高 ${currentTask.max_points} 积分，并允许：${[currentTask.allow_rain_surcharge?'雨天':'',currentTask.allow_wait_surcharge?'等待':'',currentTask.allow_detour_surcharge?'绕行':'',currentTask.allow_night_surcharge?'夜间':''].filter(Boolean).join('、')||'无加价因素'}。`,carrierText=accepted?`我的最低价为 ${min}，考虑 ${factors||'基础路线'} 后，建议 ${agreed} 积分。条件兼容，可以成交。`:`我的最低要求超过发布方上限，本次无法成交。`;await api('negotiation_messages',{method:'POST',body:JSON.stringify({negotiation_id:n[0].id,speaker_user_id:session.user.id,speaker_role:'carrier_agent',content:carrierText,metadata:{received_offer:publisherText}})});s.innerHTML=`<div class="top"><div><div class="muted">实时写入 Supabase</div><h2>Agent 对话</h2></div></div><div class="chat"><div class="bubble left"><div class="who">发布者的任务 Agent</div>${esc(publisherText)}</div><div class="bubble right"><div class="who">${esc(profile.display_name)}的行程 Agent</div>${esc(carrierText)}</div></div><div class="ai">${accepted?'✓ 成交价 '+agreed+' 积分':'协商未达成'}</div>${accepted?'<button class="primary" onclick="acceptCarry()">我要接单</button>':'<button class="secondary" onclick="takeDbTask()">重新设置条件</button>'}` }catch(e){toast('协商失败：'+e.message)}}
async function acceptCarry(){if(!currentTask?.id){carryJoined=true;toast('示例任务已加入行程');return setTimeout(trip,500)}try{const r=await authorizedFetch(`${SB_URL}/rest/v1/rpc/accept_delivery_task`,{method:'POST',body:JSON.stringify({p_task_id:currentTask.id,p_trip_id:currentTrip.id,p_negotiation_id:currentNegotiation?.id||null,p_agreed_points:currentNegotiation?.agreed_points||currentTask.offered_points})});if(!r.ok)throw Error(await r.text());carryJoined=true;toast('已接单并写入 Supabase');setTimeout(trip,500)}catch(e){toast('接单失败：'+e.message)}}

function parse(){s.innerHTML=`<div class="top"><div><div class="muted">订单信息</div><h2>发布条件</h2></div></div><div class="field"><label>任务标题</label><input class="input" id="taskTitle" value="北门外卖带取"></div><div class="field"><label>取餐点</label><input class="input" id="taskPickup" value="北门 · 2 号外卖柜"></div><div class="field"><label>送达地点</label><input class="input" id="taskDest" value="西区 3 栋 · 大厅"></div><div class="field"><label>校区</label><select class="input" id="taskCampus"><option value="west">西区</option><option value="central">中区</option><option value="high_tech">高新区</option><option value="east">东区</option></select></div><div class="field"><label>基础积分</label><input class="input" id="taskPoints" type="number" value="25"></div><div class="field"><label>最高接受积分</label><input class="input" id="taskMaxPoints" type="number" value="30"></div><div class="card"><b>允许 Agent 考虑的加价因素</b><br><label><input id="pubRain" type="checkbox" checked> 下雨（最多 +<input id="pubRainMax" type="number" value="3" style="width:38px">）</label><br><label><input id="pubWait" type="checkbox" checked> 取餐等待超时</label><br><label><input id="pubDetour" type="checkbox" checked> 绕行距离增加</label><br><label><input id="pubNight" type="checkbox"> 夜间配送</label></div><button class="primary" onclick="createPublishedTask()">发布到任务池</button><button class="secondary" onclick="publish()">返回修改</button>`}
async function createPublishedTask(){try{toast(pendingOrderFile?'正在上传截图…':'正在发布…');const image_url=pendingOrderFile?await uploadFile(pendingOrderFile,'order'):null;const body={publisher_id:session.user.id,title:document.getElementById('taskTitle').value,pickup_name:document.getElementById('taskPickup').value,destination_name:document.getElementById('taskDest').value,campus:document.getElementById('taskCampus').value,deadline_at:new Date(Date.now()+45*60000).toISOString(),offered_points:+document.getElementById('taskPoints').value,max_points:+document.getElementById('taskMaxPoints').value,status:'open',image_url,allow_rain_surcharge:document.getElementById('pubRain').checked,rain_surcharge_max:+document.getElementById('pubRainMax').value,allow_wait_surcharge:document.getElementById('pubWait').checked,allow_detour_surcharge:document.getElementById('pubDetour').checked,allow_night_surcharge:document.getElementById('pubNight').checked};if(body.max_points<body.offered_points)throw Error('最高积分不能低于基础积分');const rows=await api('delivery_tasks',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});currentTask=rows[0];toast('任务与协商条件已发布');setTimeout(home,500)}catch(e){toast('发布失败：'+e.message)}}
function matching(){step(1);s.innerHTML=`<div class="top"><div><div class="muted">调度 Agent</div><h2>找到最佳顺路人</h2></div></div><div class="match"><div class="muted" style="color:#bcd0c1">路线匹配度</div><div class="score">92%</div><b>林远 · 计算机学院</b><p style="font-size:12px;color:#c7d7cb">正从北门返回西区 2 栋，仅需多走 90 米。</p></div><div class="card"><b>设置我的 Agent</b><p class="muted">期望报价</p><div class="choices"><button onclick="pick(this)">20 分</button><button class="on" onclick="pick(this)">25 分</button><button onclick="pick(this)">28 分</button></div><p class="muted">最高接受</p><div class="choices"><button onclick="pick(this)">28 分</button><button class="on" onclick="pick(this)">30 分</button><button onclick="pick(this)">35 分</button></div><p class="muted">允许考虑的加价因素</p><div class="choices"><button class="on" onclick="this.classList.toggle('on')">☂ 下雨</button><button onclick="this.classList.toggle('on')">夜间</button><button class="on" onclick="this.classList.toggle('on')">绕行距离</button></div></div><button class="primary" onclick="negotiate()">开始协商</button><button class="secondary" onclick="home()">取消</button>`}
function pick(e){[...e.parentNode.children].forEach(x=>x.classList.remove('on'));e.classList.add('on')}
function negotiate(){step(2);s.innerHTML=`<div class="top"><div><div class="muted">与林同学的协商</div><h2>Agent 对话</h2></div><button class="chip" onclick="matching()">设置</button></div><div class="chat"><div class="bubble right"><div class="who">陈同学的任务 Agent</div>你好，任务送到西区 3 栋，基础报价 25 积分，18:25 前送达，可以接受吗？</div><div class="bubble left"><div class="who">林同学的行程 Agent</div>路线只需绕行 90 米，不过北门当前正在下雨，等待取餐和保护餐品会增加成本。</div><div class="bubble left"><div class="who">林同学的行程 Agent</div>我的建议是 28 积分，可以吗？</div><div class="bubble right"><div class="who">陈同学的任务 Agent</div>雨天属于陈同学允许考虑的因素；28 分没有超过 30 分上限。可以接受。</div><div class="bubble left"><div class="who">林同学的行程 Agent</div>成交。我会提醒林同学按时取餐，并同步位置。</div></div><div class="ai">✓ 成交价 28 积分 · 协商用时 3.2 秒</div><button class="primary" onclick="tracking()">查看配送进度</button>`}
function tracking(){step(3);s.innerHTML=`<div class="top"><div><div class="muted">任务 #SD0813</div><h2>正在为你带回</h2></div><div class="avatar">林</div></div><div class="progress"><span style="width:68%"></span></div><div class="timeline"><div class="event"><b>智能匹配完成</b><div class="muted">18:03 · 28 积分已冻结</div></div><div class="event"><b>已到达北门外卖柜</b><div class="muted">18:10 · Agent 已提醒取餐</div></div><div class="event"><b>已取货</b><div class="muted">18:13 · 餐品外观完好</div></div><div class="event now"><b>正在前往西区 3 栋</b><div class="muted">预计 18:19 到达 · 距离 320m</div></div></div><div class="card"><b>交付动态码</b><p class="muted">当面核验后，积分才会转给带取人</p><div class="code">7 2 9 4</div></div><button class="primary" onclick="done()">模拟扫码，确认收到</button>`}
function done(){s.innerHTML=`<div style="text-align:center;padding-top:80px"><div style="font-size:64px">✓</div><h2>这次顺带，完成了</h2><p class="muted">28 积分已转给林远<br>双方信誉分已更新</p><div class="card" style="text-align:left"><b>评价这次带取</b><p style="font-size:28px;color:#ffb000">★★★★★</p><div class="meta"><span>准时送达</span><span>餐品完好</span><span>沟通顺畅</span></div></div><button class="primary" onclick="home()">返回任务广场</button></div>`;toast('🎉 校园共享运力 +1')}
const renderHome=home;home=async function(){await renderHome();const candidates=publishedTasks.filter(t=>t.status==='completed'&&!t.assignments?.[0]?.delivered_at);await Promise.all(candidates.map(async t=>{try{const detail=await getPublisherDetail(t.id);if(!detail.assignment?.delivered_at)return;const button=[...s.querySelectorAll('button')].find(b=>b.getAttribute('onclick')===`publisherTask('${t.id}')`);if(button){button.textContent='已完成';button.className='secondary'}}catch(e){console.warn('完成状态同步失败',e)}}))}
async function boot(){try{const saved=JSON.parse(localStorage.getItem('shundai_session')||'null');if(!saved?.access_token)return authView();session=saved;if(!session.expires_at||session.expires_at*1000<Date.now()+60000)await refreshSession();await loadState();nav.style.display='flex';home()}catch(e){localStorage.removeItem('shundai_session');authView('登录状态已失效，请重新登录。')}}boot();
</script></body></html>
